## Example MiniOS live-config settings.
## Copy only the settings required by the image; command-line parameters take
## precedence over this file.

LIVE_HOSTNAME="minios"

## Wired static IPv4. Use dhcp or leave unset to preserve image defaults.
LIVE_NETWORK_METHOD="static"
LIVE_NETWORK_INTERFACE="enp1s0"
LIVE_NETWORK_ADDRESS="192.0.2.10"
LIVE_NETWORK_PREFIX="24"
LIVE_NETWORK_GATEWAY="192.0.2.1"
LIVE_NETWORK_DNS="1.1.1.1,9.9.9.9"
LIVE_NETWORK_BACKEND="auto"

## Security posture. Unset values preserve historical MiniOS behavior.
LIVE_SUDO_MODE="password"
LIVE_POLKIT_MODE="password"
LIVE_SSH_PERMIT_ROOT_LOGIN="false"
LIVE_SSH_PASSWORD_AUTHENTICATION="true"
LIVE_XRDP_MODE="hardened"
LIVE_X11_MODE="hardened"
LIVE_ISSUE_PASSWORD_HINTS="false"
LIVE_LOCKSCREEN_MODE="hardened"

## Link user directories on the existing writable MiniOS data medium.
## Link and bind modes are mutually exclusive and unavailable with toram.
LIVE_LINK_USER_DIRS="true"
LIVE_BIND_USER_DIRS="false"
LIVE_USER_DIRS_PATH="/minios/userdata"

LIVE_CONFIG_CMDLINE="noautologin"
